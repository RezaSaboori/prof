<svg
  viewBox="0 0 16 16"
  xmlns="http://www.w3.org/2000/svg"
  width="200"
  height="200"
  fill="none"
  style="color: #f8f8f8;"
>
  <style>
    @keyframes check {
      to {
        stroke-dashoffset: 0;
      }
    }
  </style>

  <rect
    x="0.5"
    y="0.5"
    width="11"
    height="15"
    rx="3"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
  />

  <path
    d="M3 5h6M3 8.5h3"
    fill="none"
    stroke="currentColor"
    stroke-linecap="round"
    stroke-width="1.5"
    stroke-dasharray="100"
    stroke-dashoffset="100"
    style="animation: check 3s infinite cubic-bezier(.99,-.1,.01,1.02)"
  />
</svg>